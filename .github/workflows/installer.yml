name: Installer checks
on:
  push:
    paths: ['install.sh', 'tests/test_installer.py', 'pet/**', 'pet-winter/**', '.github/workflows/installer.yml']
  pull_request:
    paths: ['install.sh', 'tests/test_installer.py', 'pet/**', 'pet-winter/**', '.github/workflows/installer.yml']
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        include:
          - os: macos-latest
            python: '3.12'
          # Ubuntu 24.04 still has a setup-python build for the minimum supported version.
          - os: ubuntu-24.04
            python: '3.8'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sh -n install.sh
      - run: python3 -B -m unittest discover -s tests -v
