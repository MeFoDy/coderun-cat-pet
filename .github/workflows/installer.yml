name: Installer checks
on:
  push:
    paths: ['install.sh', 'tests/test_installer.py', 'pet/**', '.github/workflows/installer.yml']
  pull_request:
    paths: ['install.sh', 'tests/test_installer.py', 'pet/**', '.github/workflows/installer.yml']
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: sh -n install.sh
      - run: python3 -B -m unittest discover -s tests -v
